<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>

    <!-- Glass Gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.6" />
    </linearGradient>

    <!-- Blur Filter -->
    <filter id="blurEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>

    <!-- Inner Shadow for Glass -->
    <filter id="glassShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.75" specularExponent="20" lightingColor="#ffffff" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="litPaint"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgGradient)" rx="20"/>

  <!-- Decorative Blur Circles (Fluid Effect) -->
  <circle cx="80" cy="60" r="50" fill="rgba(255,255,255,0.3)" filter="url(#blurEffect)">
    <animate attributeName="r" values="50;55;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.4;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="140" r="40" fill="rgba(255,255,255,0.25)" filter="url(#blurEffect)">
    <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="100" r="30" fill="rgba(255,255,255,0.2)" filter="url(#blurEffect)">
    <animate attributeName="cy" values="100;95;100" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass Card Container -->
  <g filter="url(#glassShadow)">
    <rect x="50" y="40" width="300" height="120" rx="24" fill="url(#glassGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

    <!-- Inner highlight for glass effect -->
    <path d="M 50 64 Q 50 40 74 40 L 326 40 Q 350 40 350 64" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Route Icon (Fluid Path) -->
  <g transform="translate(80, 100)">
    <!-- Path Line -->
    <path d="M 0 0 Q 20 -15 40 0 T 80 0" fill="none" stroke="url(#iconGradient)" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Start Point -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.9">
      <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- End Point with Pulse -->
    <circle cx="80" cy="0" r="8" fill="#ffffff" opacity="0.8">
      <animate attributeName="r" values="8;10;8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="0" r="4" fill="#667eea" opacity="1"/>
  </g>

  <!-- Text "DikaRoute" -->
  <text x="200" y="115" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5" opacity="0.95">
    Dika<tspan fill="#ffffff" opacity="0.7">Route</tspan>
  </text>

  <!-- Subtle underline accent -->
  <line x1="140" y1="125" x2="260" y2="125" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Glass shine effect -->
  <ellipse cx="200" cy="70" rx="80" ry="15" fill="rgba(255,255,255,0.15)" transform="rotate(-10 200 70)"/>
</svg>
