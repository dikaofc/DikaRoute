<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">DikaRoute — Unified AI Gateway</title>
  <desc id="hero-desc">Animated 3D isometric cube representing the DikaRoute AI gateway, with orbiting rings, pulsing network nodes, and fluid gradient blobs.</desc>

  <defs>
    <style>
      /* System font stack only — external imports are blocked when the SVG is rendered as an image. */
      .title-text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 800; }
      .sub-text  { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 600; letter-spacing: 3.5px; }

      /* ── Animations ── */
      @keyframes blob-1 { 0%   { transform: translate(0,0) scale(1); }   100% { transform: translate(38px,30px) scale(1.14); } }
      @keyframes blob-2 { 0%   { transform: translate(0,0) scale(1); }   100% { transform: translate(-34px,22px) scale(0.9); } }
      @keyframes blob-3 { 0%   { transform: translate(0,0) scale(1); }   100% { transform: translate(26px,-28px) scale(1.18); } }
      @keyframes float-cube { 0%,100% { transform: translateY(0); }      50%   { transform: translateY(-8px); } }
      @keyframes glow-pulse  { 0%,100% { opacity: 0.35; }                50%   { opacity: 0.8; } }
      @keyframes spin       { to { transform: rotate(360deg); } }
      @keyframes ring-dash  { to { stroke-dashoffset: -140; } }
      @keyframes node-pulse { 0%,100% { opacity: 0.25; }                 50%   { opacity: 1; } }
      @keyframes title-shine{ 0%,100% { opacity: 0.9; }                  50%   { opacity: 1; } }
      @keyframes beam       { 0%,100% { opacity: 0.06; }                 50%   { opacity: 0.3; } }

      .blob1 { animation: blob-1 9s  infinite alternate ease-in-out; }
      .blob2 { animation: blob-2 11s infinite alternate ease-in-out; }
      .blob3 { animation: blob-3 13s infinite alternate ease-in-out; }

      .cube   { animation: float-cube 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .glow   { animation: glow-pulse 4s ease-in-out infinite; }
      .orbit  { animation: spin 9s linear infinite;           transform-box: fill-box; transform-origin: center; }
      .orbit2 { animation: spin 15s linear infinite reverse;  transform-box: fill-box; transform-origin: center; }
      .dashed { animation: ring-dash 7s linear infinite; }
      .node-p { animation: node-pulse 3s ease-in-out infinite; }
      .beam   { animation: beam 6s ease-in-out infinite; }
      .shine  { animation: title-shine 3.5s ease-in-out infinite; }
    </style>

    <!-- Brand gradients (match public/dikaroute.svg) -->
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="grad-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="grad-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-heavy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="cube-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#22d3ee" flood-opacity="0.45"/>
    </filter>
  </defs>


  <!-- Fluid gradient mesh -->
  <g filter="url(#blur-heavy)">
    <circle class="blob1" cx="150" cy="90"  r="150" fill="url(#grad-purple)" opacity="0.5"/>
    <circle class="blob2" cx="520" cy="200" r="160" fill="url(#grad-cyan)" opacity="0.4"/>
    <circle class="blob3" cx="360" cy="40"  r="120" fill="url(#grad-pink)" opacity="0.32"/>
  </g>

  <!-- Soft radial glow behind the cube -->
  <circle class="glow" cx="320" cy="112" r="120" fill="url(#core-glow)"/>

  <!-- ── Left network graph ── -->
  <g stroke="rgba(148,163,184,0.5)" stroke-width="1.4">
    <line x1="128" y1="78"  x2="178" y2="118"/>
    <line x1="128" y1="78"  x2="132" y2="150"/>
    <line x1="178" y1="118" x2="132" y2="150"/>
    <line x1="178" y1="118" x2="222" y2="92"/>
  </g>
  <g fill="#22d3ee">
    <circle class="node-p" cx="128" cy="78"  r="5"/>
    <circle class="node-p" cx="178" cy="118" r="5" style="animation-delay:0.8s"/>
    <circle class="node-p" cx="132" cy="150" r="5" style="animation-delay:1.6s"/>
  </g>
  <circle cx="222" cy="92" r="4" fill="#a78bfa" class="node-p" style="animation-delay:2.2s"/>

  <!-- ── Right network graph (mirrored) ── -->
  <g stroke="rgba(148,163,184,0.5)" stroke-width="1.4">
    <line x1="512" y1="78"  x2="462" y2="118"/>
    <line x1="512" y1="78"  x2="508" y2="150"/>
    <line x1="462" y1="118" x2="508" y2="150"/>
    <line x1="462" y1="118" x2="418" y2="92"/>
  </g>
  <g fill="#f472b6">
    <circle class="node-p" cx="512" cy="78"  r="5" style="animation-delay:1.2s"/>
    <circle class="node-p" cx="462" cy="118" r="5" style="animation-delay:0.4s"/>
    <circle class="node-p" cx="508" cy="150" r="5" style="animation-delay:2s"/>
  </g>
  <circle cx="418" cy="92" r="4" fill="#22d3ee" class="node-p" style="animation-delay:0.6s"/>

  <!-- ── 3D Gateway Cube ── -->
  <g class="cube" filter="url(#cube-glow)">
    <!-- Top face (cyan) -->
    <polygon points="320,64 368,88 320,112 272,88" fill="url(#grad-cyan)" opacity="0.95"/>
    <!-- Right face (purple) -->
    <polygon points="368,88 368,136 320,160 320,112" fill="url(#grad-purple)" opacity="0.92"/>
    <!-- Left face (pink) -->
    <polygon points="272,88 320,112 320,160 272,136" fill="url(#grad-pink)" opacity="0.88"/>
    <!-- Edges -->
    <g fill="none" stroke="url(#grad-edge)" stroke-width="2" stroke-linejoin="round">
      <polygon points="320,64 368,88 320,112 272,88"/>
      <polygon points="368,88 368,136 320,160 320,112"/>
      <polygon points="272,88 320,112 320,160 272,136"/>
    </g>
    <!-- Node dot on top face -->
    <circle cx="320" cy="88" r="5" fill="#ffffff" opacity="0.95"/>
    <circle cx="320" cy="88" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Floor shadow (stays put while the cube floats) -->
  <ellipse class="glow" cx="320" cy="168" rx="46" ry="10" fill="#000000" opacity="0.35"/>

  <!-- ── Orbiting rings ── -->
  <g class="orbit">
    <ellipse cx="320" cy="112" rx="96" ry="40" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.55" stroke-dasharray="2 10"/>
    <circle cx="320" cy="72" r="4" fill="#22d3ee"/>
    <circle cx="320" cy="152" r="3" fill="#22d3ee" opacity="0.7"/>
  </g>
  <g class="orbit2">
    <ellipse cx="320" cy="112" rx="76" ry="32" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 10"/>
    <circle cx="320" cy="80" r="3" fill="#a78bfa"/>
  </g>
  <ellipse class="dashed" cx="320" cy="112" rx="112" ry="46" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35" stroke-dasharray="5 14"/>

  <!-- Vertical signal beams -->
  <rect class="beam" x="316" y="40"  width="8"  height="24" rx="4" fill="url(#grad-cyan)"/>
  <rect class="beam" x="316" y="176" width="8"  height="24" rx="4" fill="url(#grad-cyan)" style="animation-delay:2s"/>
  <rect class="beam" x="352" y="52"  width="5"  height="16" rx="2.5" fill="url(#grad-pink)" style="animation-delay:1s"/>
  <rect class="beam" x="285" y="52"  width="5"  height="16" rx="2.5" fill="url(#grad-purple)" style="animation-delay:3s"/>

  <!-- ── Branding ── -->
  <g class="shine">
    <text class="title-text" x="320" y="206" text-anchor="middle" font-size="46" fill="url(#grad-text)">DikaRoute</text>
    <text class="sub-text" x="320" y="230" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.72)">UNIFIED AI GATEWAY · INTELLIGENT MODEL ROUTER</text>
  </g>
  <rect x="282" y="238" width="76" height="3" rx="1.5" fill="url(#grad-cyan)" opacity="0.8"/>
</svg>
