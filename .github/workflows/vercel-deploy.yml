# Deploy DikaRoute to Vercel (stately preview/demo front)
#
# Optional. Requires a Vercel account + token. This runs the same build/install
# commands as `vercel.json` — see docs/ops/vercel-deployment-guide.md.
#
# Preconditions:
#   1. Install the Vercel CLI locally (or use `vercel dev`).
#   2. Add a Vercel access token as a repo secret named VERCEL_TOKEN
#      (or use the Vercel GitHub App integration instead of this workflow).
#   3. `vercel link` already exists locally so `--token` + `--prod` resolve the
#      project (you can pass `VERCEL_PROJECT_ID` / `VERCEL_ORG_ID` too).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'dikaofc/DikaRoute'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}