# Deploy DikaRoute to Vercel (stately preview/demo front)
#
# Optional. Requires a Vercel account + token. This runs the same build/install
# commands as `vercel.json` — see docs/ops/vercel-deployment-guide.md.
#
# Preconditions (repo secrets, or the Vercel GitHub App integration):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Until those are configured this workflow skips cleanly (success, no deploy).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'dikaofc/DikaRoute'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Verify Vercel secrets are configured
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping Vercel deploy. See docs/ops/vercel-deployment-guide.md."
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel env
        if: env.SKIP_DEPLOY != '1'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        if: env.SKIP_DEPLOY != '1'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        if: env.SKIP_DEPLOY != '1'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"