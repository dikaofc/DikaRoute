name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      # Git ref (tag, e.g. `v3.8.59`) to build & publish. Auto-release pushes a
      # `vX.Y.Z` tag on the release commit and dispatches against it, so the
      # checkout never races the `main` ref update (a `--ref main` dispatch
      # right after push can still resolve to the PREVIOUS commit, as seen in
      # the 3.8.59 run that built 3.8.58 and skipped publishing). Raw commit
      # SHAs are rejected by actions/checkout ("upload-pack: not our ref"),
      # which is why the tag is required. Falls back to the default ref
      # (main) for manual dispatches / push triggers.
      release_ref:
        description: "Tag ref to build (e.g. v3.8.59; auto-set by Auto Release workflow)"
        required: false
        type: string

jobs:
  # UI/design-system validation gate — lint + typecheck must pass before any
  # release artifact is built or published (added with the iOS Fluid Glass redesign).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Lint
        run: npm run lint

      - name: Typecheck core
        run: npm run typecheck:core

  publish:
    runs-on: ubuntu-latest
    needs: validate
    # The repo default is "read" for the auto-generated GITHUB_TOKEN, which
    # makes the release step below fail with 403 ("Resource not accessible by
    # integration"). Grant contents: write for THIS job only so npm publish and
    # the GitHub Release creation succeed; everything else stays read-only.
    permissions:
      contents: write

    steps:
      # Auto-release passes the release bump commit SHA so the build never
      # races the `main` ref update; manual dispatches and push triggers fall
      # back to the default ref (main). Resolved in a dedicated step because
      # `github.event.inputs` does not exist for push events.
      - name: Resolve build ref
        id: build-ref
        run: |
          if [ -n "${{ github.event.inputs.release_ref }}" ]; then
            echo "REF=${{ github.event.inputs.release_ref }}" >> $GITHUB_OUTPUT
          else
            echo "REF=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.build-ref.outputs.REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # Full production build — 100% in CI, never local. `build:cli` runs
      # scripts/build/prepublish.ts, which consumes .build/next/standalone and
      # AUTOMATICALLY triggers `npm run build` (build-next-isolated.mjs → full
      # Next.js Turbopack production build + standalone assembly) when the
      # artifact is absent, then bundles the CLI entrypoint, MITM stack, MCP
      # server, LLMLingua worker and @dikaroute/opencode-plugin into dist/.
      - name: Build package (Next.js standalone + CLI + sidecars)
        run: npm run build:cli
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          DIKAROUTE_BUILD_MEMORY_MB: 8192

      - name: Verify dist folder
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: Build failed - dist folder not found"
            exit 1
          fi
          if [ ! -f "dist/server.js" ]; then
            echo "ERROR: Build failed - dist/server.js not found"
            exit 1
          fi
          echo "dist size: $(du -sh dist)"

      - name: Get package version
        id: pkg
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Pre-publish packaging gate: catch malformed tarballs (E415 hard links,
      # missing files, wrong file list) before anything is pushed to the registry.
      - name: Validate npm tarball (pack dry-run)
        run: npm pack --dry-run --json > /tmp/pack.json && node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8')); console.log('tarball bytes:', p[0]?.size ?? 'n/a', '| files:', p[0]?.files?.length ?? 'n/a')"

      - name: Check if version already published
        id: check-version
        run: |
          if npm view dikaroute@${{ steps.pkg.outputs.VERSION }} version > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg.outputs.VERSION }} already exists on npm"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg.outputs.VERSION }} is new"
          fi
        continue-on-error: true

      - name: Publish to npm
        if: steps.check-version.outputs.exists != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.check-version.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          name: DikaRoute v${{ steps.pkg.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        if: steps.check-version.outputs.exists != 'true'
        run: |
          echo "✅ DikaRoute v${{ steps.pkg.outputs.VERSION }} published to npm!"
          echo "📦 https://www.npmjs.com/package/dikaroute"
          echo "📦 https://github.com/dikaofc/DikaRoute/releases/tag/v${{ steps.pkg.outputs.VERSION }}"
